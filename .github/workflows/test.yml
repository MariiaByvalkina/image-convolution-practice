name: Testing

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system pytest numpy pillow mypy ruff hypothesis

      - name: Lint and Format with Ruff
        run: uv run ruff check src/ --ignore=E501,E203

      - name: Type check with Mypy
        run: MYPYPATH=src uv run mypy src/ --ignore-missing-imports

      - name: Run tests
        run: PYTHONPATH=src uv run pytest tests/test_convolution.py -v
